---
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
spec:
  controller:
{{- if .Values.eePullSecret.manage }}
    ee_pull_credentials_secret: ee-pull-secret
{{- end }}
    disabled: false
  eda:
    disabled: {{ coalesce .Values.aap.eda_disabled "false"  }}
{{- if semverCompare ">=2.5.0" (toString .Values.aap.release) }}
  hub:
    disabled: {{ .Values.aap.hub_disabled }}
{{- if not .Values.aap.hub_disabled }}
    {{- include "aap.hubStorage" . | nindent 4 }}
{{- end }}
{{- end }}
  lightspeed:
    disabled: {{ coalesce .Values.aap.lightspeed_disabled "false" }}
